name: Desplegar ticket-hub en local (microk8s de pcbox)

on:
  workflow_dispatch:

concurrency:
  group: deploy-ticket-hub-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Desplegar ticket-hub en microk8s.
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: local
    steps:
      - name: Clonar el repositorio para acceder a los manifiestos.
        uses: actions/checkout@v4

      - name: Unirse a la red de Tailscale para llegar al servidor API de microk8s.
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:continuous-integration

      - name: Generar el archivo de kubeconfig y exportarlo como la variable de entorno KUBECONFIG.
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_MICROK8S }}
        run: |
          KUBECONFIG_PATH="$(bash ./scripts/guardar-kubeconfig.sh "$KUBECONFIG_CONTENT" "$RUNNER_TEMP/ticket-hub-kubeconfig")"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Crear una copia de trabajo de los manifiestos de ticket-hub antes de aplicarlos.
        run: |
          MANIFESTS_DIR="$(bash ./scripts/crear-copia-de-trabajo-de-manifiestos.sh .github/workflows/ticket-hub/manifests "$RUNNER_TEMP/ticket-hub-manifests")"
          echo "MANIFESTS_DIR=$MANIFESTS_DIR" >> "$GITHUB_ENV"

      - name: Reemplazar el nombre de usuario de Docker Hub y la etiqueta local en el manifiesto de despliegue.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: bash ./scripts/reemplazar-placeholders-deployment.sh "$DOCKERHUB_USERNAME" "$IMAGE_TAG" "$MANIFESTS_DIR/deployment.yaml"

      - name: Aplicar los manifiestos de ticket-hub al clúster de microk8s.
        run: kubectl apply -f "$MANIFESTS_DIR/"

      - name: Reiniciar el despliegue de ticket-hub para descargar la nueva imagen.
        run: kubectl rollout restart deployment/ticket-hub -n ticket-hub

      - name: Esperar a que finalice el rollout de ticket-hub.
        run: kubectl rollout status deployment/ticket-hub -n ticket-hub --timeout=180s

      - name: Mostrar los pods en ejecución de ticket-hub.
        run: kubectl get pods -n ticket-hub -l app=ticket-hub

      - name: Mostrar eventos recientes del namespace ticket-hub si falla el despliegue.
        if: failure()
        run: kubectl get events -n ticket-hub --sort-by=.lastTimestamp || true
