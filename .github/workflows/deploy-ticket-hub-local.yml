name: Desplegar ticket-hub en local

on:
  workflow_dispatch:

concurrency:
  group: deploy-ticket-hub-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-local.yml
    with:
      app_name: ticket-hub
      deployment_name: ticket-hub
      namespace: ticket-hub
      app_repository: jtagram/ticket-hub
      app_ref: local
      image_repository: ticket-hub
    secrets: inherit
