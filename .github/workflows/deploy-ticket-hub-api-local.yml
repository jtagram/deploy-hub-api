name: Desplegar ticket-hub-api en local

on:
  workflow_dispatch:

concurrency:
  group: deploy-ticket-hub-api-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-local.yml
    with:
      app_name: ticket-hub-api
      deployment_name: ticket-hub-api
      namespace: ticket-hub-api
      app_repository: jtagram/ticket-hub-api
      app_ref: local
      image_repository: ticket-hub-api
    secrets: inherit
