apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-hub-api
  namespace: infra-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infra-hub-api
  template:
    metadata:
      labels:
        app: infra-hub-api
    spec:
      serviceAccountName: infra-hub-api
      containers:
        - name: infra-hub-api
          image: docker.io/DOCKERHUB_USER/infra-hub-api:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_HOST
              value: postgres.databases.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: infra_hub
            - name: PORT
              value: "3000"
            - name: LOG_LEVEL
              value: "info"
            - name: AUTH_API_URL
              value: http://iam-api.iam-api.svc.cluster.local:3000
            - name: SERVER_SSH_HOST
              valueFrom:
                secretKeyRef:
                  name: server-ssh-key
                  key: SERVER_SSH_HOST
            - name: SERVER_SSH_USER
              valueFrom:
                secretKeyRef:
                  name: server-ssh-key
                  key: SERVER_SSH_USER
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: ssh-key
              mountPath: /etc/ssh-keys
              readOnly: true
      volumes:
        - name: ssh-key
          secret:
            secretName: pcbox-ssh-key
            defaultMode: 0400
