name: Lanzar y desplegar ticket-hub-api en dev (microk8s de pcbox)

on:
  workflow_dispatch:
    inputs:
      previous_stable_tag:
        description: "Tag que se mantiene como la última versión estable conocida (formato dev-vNUMERO.NUMERO.NUMERO)"
        required: true
        type: string
      new_tag:
        description: "Nuevo tag de versión para compilar, publicar y desplegar (formato dev-vNUMERO.NUMERO.NUMERO)"
        required: true
        type: string

concurrency:
  group: deploy-ticket-hub-api-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      approver_environment: development-approver
      app_name: ticket-hub-api
      deployment_name: ticket-hub-api
      namespace: ticket-hub-api
      app_repository: jtagram/ticket-hub-api
      app_ref: dev
      deploy_hub_ref: dev
      tag_prefix: dev-
      image_repository: ticket-hub-api
      run_e2e_tests: true
      previous_stable_tag: ${{ inputs.previous_stable_tag }}
      new_tag: ${{ inputs.new_tag }}
    secrets: inherit
