name: Desplegar infra-hub-api en local

on:
  workflow_dispatch:

concurrency:
  group: deploy-infra-hub-api-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-local.yml
    with:
      app_name: infra-hub-api
      deployment_name: infra-hub-api
      namespace: infra-hub-api
      app_repository: jtagram/infra-hub-api
      app_ref: local
      image_repository: infra-hub-api
    secrets: inherit
