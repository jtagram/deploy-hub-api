name: Lanzar y desplegar iam-api en dev (microk8s de pcbox) v2

on:
  workflow_dispatch:
    inputs:
      previous_stable_tag:
        description: "Tag que se mantiene como la última versión estable conocida (formato dev-vNUMERO.NUMERO.NUMERO)"
        required: true
        type: string
      new_tag:
        description: "Nuevo tag de versión para compilar, publicar y desplegar (formato dev-vNUMERO.NUMERO.NUMERO)"
        required: true
        type: string

concurrency:
  group: deploy-iam-api-dev-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-backend.yml
    with:
      environment: dev
      approver_environment: development-approver
      app_name: iam-api
      deployment_name: iam-api
      namespace: iam-api
      app_repository: jtagram/iam-api
      app_ref: dev
      deploy_hub_ref: dev
      tag_prefix: dev-
      image_repository: iam-api
      previous_stable_tag: ${{ inputs.previous_stable_tag }}
      new_tag: ${{ inputs.new_tag }}
    secrets: inherit
