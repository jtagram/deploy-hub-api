name: Desplegar iam-api en prod

on:
  workflow_dispatch:
    inputs:
      previous_stable_tag:
        description: "Tag que se mantiene como la última versión estable conocida (formato prod-vNUMERO.NUMERO.NUMERO)"
        required: true
        type: string
      new_tag:
        description: "Nuevo tag de versión para compilar, publicar y desplegar (formato prod-vNUMERO.NUMERO.NUMERO)"
        required: true
        type: string

concurrency:
  group: deploy-iam-api-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      approver_environment: production-approver
      app_name: iam-api
      deployment_name: iam-api
      namespace: iam-api
      app_repository: jtagram/iam-api
      app_ref: master
      deploy_hub_ref: master
      tag_prefix: prod-
      image_repository: iam-api
      run_e2e_tests: true
      previous_stable_tag: ${{ inputs.previous_stable_tag }}
      new_tag: ${{ inputs.new_tag }}
    secrets: inherit
