name: Desplegar iam-api en producción (microk8s de pcbox)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Etiqueta de la imagen a desplegar (formato vNUMERO.NUMERO.NUMERO, ejemplo: v0.9.10)"
        required: true

concurrency:
  group: deploy-iam-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validar secretos y manifiestos del despliegue antes de continuar.
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Clonar el repositorio para acceder al script de validación.
        uses: actions/checkout@v4

      - name: Verificar que el secreto DOCKERHUB_USERNAME esté definido.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: bash ./scripts/validar-secreto.sh DOCKERHUB_USERNAME "$DOCKERHUB_USERNAME"

      - name: Verificar que el secreto KUBECONFIG_MICROK8S esté definido.
        env:
          KUBECONFIG_MICROK8S: ${{ secrets.KUBECONFIG_MICROK8S }}
        run: bash ./scripts/validar-secreto.sh KUBECONFIG_MICROK8S "$KUBECONFIG_MICROK8S"

      - name: Verificar que el secreto TS_OAUTH_CLIENT_ID esté definido.
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        run: bash ./scripts/validar-secreto.sh TS_OAUTH_CLIENT_ID "$TS_OAUTH_CLIENT_ID"

      - name: Verificar que el secreto TS_OAUTH_SECRET esté definido.
        env:
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: bash ./scripts/validar-secreto.sh TS_OAUTH_SECRET "$TS_OAUTH_SECRET"

      - name: Validar la sintaxis YAML del manifiesto namespace.yaml.
        run: bash ./scripts/validar-yaml-manifiestos.sh .github/workflows/iam-api/manifests/namespace.yaml

      - name: Validar la sintaxis YAML del manifiesto deployment.yaml.
        run: bash ./scripts/validar-yaml-manifiestos.sh .github/workflows/iam-api/manifests/deployment.yaml

      - name: Validar la sintaxis YAML del manifiesto service.yaml.
        run: bash ./scripts/validar-yaml-manifiestos.sh .github/workflows/iam-api/manifests/service.yaml

      - name: Validar el formato de la etiqueta de imagen recibida como entrada.
        env:
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: bash ./scripts/validar-formato-de-tag.sh IMAGE_TAG "$REQUESTED_IMAGE_TAG"

      - name: Validar que la etiqueta de imagen exista como tag en GitHub (iam-api).
        env:
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: bash ./scripts/validar-tag-en-github.sh jtagram/iam-api "$REQUESTED_IMAGE_TAG"

      - name: Validar que la etiqueta de imagen exista en Docker Hub.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: bash ./scripts/validar-tag-en-dockerhub.sh "$DOCKERHUB_USERNAME" "iam-api" "$REQUESTED_IMAGE_TAG"

  deploy:
    name: Desplegar iam-api en microk8s.
    needs: validate
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Clonar el repositorio para acceder a los manifiestos.
        uses: actions/checkout@v4

      - name: Guardar la etiqueta de imagen validada en GITHUB_ENV.
        env:
          REQUESTED_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          IMAGE_TAG="$(bash ./scripts/validar-tag-imagen.sh "$REQUESTED_IMAGE_TAG")"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Unirse a la red de Tailscale para llegar al servidor API de microk8s.
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:continuous-integration

      - name: Generar el archivo de kubeconfig y exportarlo como la variable de entorno KUBECONFIG.
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_MICROK8S }}
        run: |
          KUBECONFIG_PATH="$(bash ./scripts/guardar-kubeconfig.sh "$KUBECONFIG_CONTENT" "$RUNNER_TEMP/iam-api-kubeconfig")"
          echo "KUBECONFIG=$KUBECONFIG_PATH" >> "$GITHUB_ENV"

      - name: Verificar que el clúster de microk8s sea accesible antes de aplicar los manifiestos.
        run: kubectl get nodes

      - name: Crear una copia de trabajo de los manifiestos de iam-api antes de aplicarlos.
        run: |
          MANIFESTS_DIR="$(bash ./scripts/crear-copia-de-trabajo-de-manifiestos.sh .github/workflows/iam-api/manifests "$RUNNER_TEMP/iam-api-manifests")"
          echo "MANIFESTS_DIR=$MANIFESTS_DIR" >> "$GITHUB_ENV"

      - name: Reemplazar el nombre de usuario de Docker Hub y la etiqueta de la imagen en el manifiesto de despliegue.
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: bash ./scripts/reemplazar-placeholders-deployment.sh "$DOCKERHUB_USERNAME" "$IMAGE_TAG" "$MANIFESTS_DIR/deployment.yaml"

      - name: Aplicar los manifiestos de iam-api al clúster de microk8s.
        run: kubectl apply -f "$MANIFESTS_DIR/"

      - name: Reiniciar el despliegue de iam-api para descargar la nueva imagen.
        run: kubectl rollout restart deployment/iam-api -n iam-api

      - name: Esperar a que finalice el rollout de iam-api.
        run: kubectl rollout status deployment/iam-api -n iam-api --timeout=180s

      - name: Mostrar el estado del despliegue de iam-api.
        run: kubectl get deployment iam-api -n iam-api

      - name: Mostrar los pods en ejecución de iam-api.
        run: kubectl get pods -n iam-api -l app=iam-api

      - name: Mostrar el servicio de iam-api.
        run: kubectl get service iam-api -n iam-api

      - name: Describir el despliegue de iam-api si la instalación falla.
        if: failure()
        run: kubectl describe deployment iam-api -n iam-api || true

      - name: Mostrar eventos recientes del namespace iam-api si falla el despliegue.
        if: failure()
        run: kubectl get events -n iam-api --sort-by=.lastTimestamp || true
