name: Desplegar iam en local

on:
  workflow_dispatch:

concurrency:
  group: deploy-iam-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-local.yml
    with:
      app_name: iam
      deployment_name: iam
      namespace: iam
      app_repository: jtagram/iam
      app_ref: local
      image_repository: iam
    secrets: inherit
