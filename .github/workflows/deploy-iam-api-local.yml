name: Desplegar iam-api en local

on:
  workflow_dispatch:

concurrency:
  group: deploy-iam-api-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-local.yml
    with:
      app_name: iam-api
      deployment_name: iam-api
      namespace: iam-api
      app_repository: jtagram/iam-api
      app_ref: local
      image_repository: iam-api
    secrets: inherit
