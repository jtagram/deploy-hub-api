apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting
  namespace: accounting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounting
  template:
    metadata:
      labels:
        app: accounting
    spec:
      serviceAccountName: accounting
      containers:
        - name: accounting
          image: docker.io/DOCKERHUB_USER/accounting:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: IAM_API_URL
              value: http://iam-api.iam-api.svc.cluster.local:3000
            - name: ACCOUNTING_APPLICATION_NAME
              value: "accounting"
            - name: ACCOUNTING_TARGET_APPLICATION_NAME
              value: "accounting-api"
            - name: ACCOUNTING_API_URL
              value: http://accounting-api.accounting-api.svc.cluster.local:3000
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
